site_name: sovthpaw
site_description: >-
  Personal site of sovthpaw (Chris) — TOWARDS SELF-IMPROVEMENT. Blog, projects,
  models, the Omni VA + Evolution Radio, and the OmniSenter pipeline.
site_url: https://southpawin.github.io/
repo_url: https://github.com/SouthpawIN/southpawin.github.io
repo_name: SouthpawIN/southpawin.github.io
edit_uri: ""

# Copyright (appears in footer)
copyright: >-
  sovthpaw · TOWARDS SELF-IMPROVEMENT

# Don't include source/timestamp/docs paths in the nav
docs_dir: docs
site_dir: site
use_directory_urls: true

# Theme
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    # Light mode — warm cream paper with gold dust accents
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode — matte black with gold dust
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/radio-tower

extra_css:
  - assets/css/extra.css
extra_javascript:
  - assets/js/share-to-x.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SouthpawIN
      name: GitHub
    - icon: fontawesome/brands/twitter
      link: https://x.com/southpawin
      name: X
  generator: false
  share:
    from: github
    platforms:
      - x
      - facebook
      - linkedin
      - reddit

# Plugins
plugins:
  - search
  - rss:
      match_path: "blog/.*"
      date_from_meta:
        as_creation: date
  - minify:
      minify_html: false
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
        collapse_whitespace: true

# Markdown extensions
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.betterem

# Navigation
nav:
  - Home: index.md
  - Blog: blog/index.md
  - Projects:
      - Overview: projects/index.md
      - Omni VA: projects/omni-va.md
      - OmniSenter: projects/omnisenter.md
  - Models:
      - Overview: models/index.md
  - Wiki: wiki/index.md
  - About: about.md

# Build settings
strict: false
dev_addr: 127.0.0.1:8765
